[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aivora-backend"
version = "0.1.0"
description = "AIvora — SaaS AI Document Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "AIvora Team" }]

dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",

  # Validation
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",

  # Database
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",  # for alembic sync migrations

  # Cache
  "redis[hiredis]>=5.2.0",

  # Security
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.20",

  # Task queue
  "celery[redis]>=5.4.0",
  "kombu>=5.4.0",

  # HTTP client (for AI providers)
  "httpx>=0.28.0",

  # Logging
  "structlog>=24.4.0",

  # Observability
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",

  # Rate limiting
  "slowapi>=0.1.9",

  # Elasticsearch
  "elasticsearch[async]>=8.17.0",

  # Utilities
  "python-dateutil>=2.9.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
  # Testing
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",         # async test client
  "anyio>=4.7.0",
  "faker>=33.0.0",

  # Type checking
  "mypy>=1.13.0",
  "types-passlib>=1.7.7",
  "types-python-jose>=3.3.4",
  "types-python-dateutil>=2.9.0",

  # Linting / formatting
  "ruff>=0.8.0",

  # Pre-commit
  "pre-commit>=4.0.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "ANN", "S", "RUF"]
ignore = [
  "ANN101",  # missing type annotation for self
  "ANN102",  # missing type annotation for cls
  "ANN401",  # Any type allowed where needed
  "S101",    # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN"]
"alembic/**/*.py" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["alembic.*", "celery.*", "kombu.*", "slowapi.*", "ulid.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--tb=short",
  "--strict-markers",
  "-v",
]
markers = [
  "unit: marks tests as unit tests",
  "integration: marks tests as integration tests",
  "e2e: marks tests as end-to-end tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
]
